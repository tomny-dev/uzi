name: Refresh AI harness workspace lockfile (temporary)
on:
  push:
    branches:
      - feat/shared-ai-sdk-harness
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve workspace dependency versions
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit refreshed lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'chore(lockfile): record AI SDK 7 harness workspace'
            git push origin HEAD:feat/shared-ai-sdk-harness
          fi
