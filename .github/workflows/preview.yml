name: Preview Publish

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  preview:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Use current npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Set preview package version
        shell: bash
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA="${GITHUB_SHA::7}"
          PREVIEW_VERSION="${BASE_VERSION}-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}.${{ github.run_attempt }}.${SHORT_SHA}"
          npm version "$PREVIEW_VERSION" --no-git-tag-version
          echo "PREVIEW_VERSION=$PREVIEW_VERSION" >> "$GITHUB_ENV"
          echo "PREVIEW_TAG=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Publish preview to npm
        run: npm publish --access public --tag "$PREVIEW_TAG"

      - name: Verify preview is available
        shell: bash
        run: |
          for attempt in {1..12}; do
            if PUBLISHED_VERSION=$(npm view "@tomny-dev/uzi@$PREVIEW_TAG" version 2>/dev/null) \
              && [ "$PUBLISHED_VERSION" = "$PREVIEW_VERSION" ] \
              && npm view "@tomny-dev/uzi@$PREVIEW_VERSION" dist.tarball >/dev/null 2>&1; then
              echo "Verified @tomny-dev/uzi@$PREVIEW_VERSION on npm."
              exit 0
            fi
            echo "Waiting for npm registry propagation (attempt $attempt/12)..."
            sleep 10
          done
          echo "::error::Published preview $PREVIEW_VERSION is not available from npm after 2 minutes."
          exit 1

      - name: Comment install instructions on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- uzi-preview-build -->';
            const body = `${marker}
            Preview package published.

            Floating PR tag:

            \`\`\`bash
            pnpm add @tomny-dev/uzi@${process.env.PREVIEW_TAG}
            \`\`\`

            Exact published version:

            \`\`\`bash
            pnpm add @tomny-dev/uzi@${process.env.PREVIEW_VERSION}
            \`\`\`

            Published version: \`${process.env.PREVIEW_VERSION}\`

            Use the PR tag to track the latest preview build for this PR. Use the exact version to pin a specific build.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
        env:
          PREVIEW_TAG: ${{ env.PREVIEW_TAG }}
          PREVIEW_VERSION: ${{ env.PREVIEW_VERSION }}
