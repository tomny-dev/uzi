name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node 24.x
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Type check AI harness
        run: pnpm --filter @tomny-dev/ai lint

      - name: Test AI harness
        run: pnpm --filter @tomny-dev/ai test

      - name: Build AI harness
        run: pnpm --filter @tomny-dev/ai build

      - name: Smoke-test packaged AI harness with Node ESM
        run: pnpm --filter @tomny-dev/ai exec node --input-type=module -e "const p = await import('./dist/index.js'); if (typeof p.createHarnessAgent !== 'function' || typeof p.createEvidenceRegistry !== 'function') process.exit(1)"

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Pack package
        run: mkdir -p package-artifacts && npm pack --pack-destination package-artifacts
