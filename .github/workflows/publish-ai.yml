name: Publish AI package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-tomny-dev-ai
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @tomny-dev/ai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org

      - name: Use supported npm trusted publishing client
        run: npm install --global npm@latest

      - name: Verify package identity and manifest
        run: |
          node -e '
            const pkg = require("./packages/ai/package.json");
            if (pkg.name !== "@tomny-dev/ai" || pkg.private || !/^[0-9]+[.][0-9]+[.][0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(pkg.version)) {
              throw new Error("Invalid package name, version, or private flag");
            }
          '

      - name: Check exact manifest version on npm
        id: registry
        shell: bash
        run: |
          NAME=$(node -p "require('./packages/ai/package.json').name")
          VERSION=$(node -p "require('./packages/ai/package.json').version")
          echo "Publishing candidate: $NAME@$VERSION"
          if npm view "$NAME@$VERSION" version --registry=https://registry.npmjs.org > /dev/null 2> npm-view-error.log; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version already exists; publishing will be skipped."
          elif grep -q 'E404' npm-view-error.log; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version is not published yet."
          else
            cat npm-view-error.log
            echo "Registry check failed; refusing to publish."
            exit 1
          fi

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package
        run: |
          pnpm --filter @tomny-dev/ai lint
          pnpm --filter @tomny-dev/ai test
          pnpm --filter @tomny-dev/ai build
          pnpm --filter @tomny-dev/ai exec node --input-type=module -e "const ai = await import('./dist/index.js'); if(typeof ai.createHarnessAgent !== 'function' || typeof ai.createEvidenceRegistry !== 'function') process.exit(1)"

      - name: Verify package contents
        working-directory: packages/ai
        run: npm pack --dry-run --json

      - name: Publish independently of Uzi using trusted publishing
        if: steps.registry.outputs.exists == 'false'
        working-directory: packages/ai
        run: npm publish --access public --provenance
