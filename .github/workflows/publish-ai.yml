name: Publish AI package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact @tomny-dev/ai version to publish (must match packages/ai/package.json)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-tomny-dev-ai
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @tomny-dev/ai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org

      - name: Use supported npm trusted publishing client
        run: npm install --global npm@latest

      - name: Verify exact package version and publishing settings
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const pkg = require("./packages/ai/package.json");
            if (pkg.name !== "@tomny-dev/ai" || pkg.private || pkg.version !== process.env.REQUESTED_VERSION) {
              throw new Error("Package name/version/private flag does not match the requested publish");
            }
          '

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package
        run: |
          pnpm --filter @tomny-dev/ai lint
          pnpm --filter @tomny-dev/ai test
          pnpm --filter @tomny-dev/ai build
          pnpm --filter @tomny-dev/ai exec node --input-type=module -e "const ai = await import('./dist/index.js'); if(typeof ai.createHarnessAgent !== 'function' || typeof ai.createEvidenceRegistry !== 'function') process.exit(1)"

      - name: Verify package contents
        working-directory: packages/ai
        run: npm pack --dry-run --json

      - name: Publish independently of Uzi
        working-directory: packages/ai
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
