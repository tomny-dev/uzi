name: Cloudflare demo deployment

# Deliberately manual: public PRs must never receive Cloudflare credentials.
# workflow_dispatch is available once this file is on the default branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uzi-cloudflare-demo
  cancel-in-progress: false

jobs:
  deploy-demo:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: uzi-demo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: pnpm
      - name: Validate demo resource configuration
        env:
          DEMO_WORKER_NAME: ${{ vars.DEMO_WORKER_NAME }}
          DEMO_D1_DATABASE_NAME: ${{ vars.DEMO_D1_DATABASE_NAME }}
          DEMO_D1_DATABASE_ID: ${{ vars.DEMO_D1_DATABASE_ID }}
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          set -euo pipefail
          node scripts/prepare-cloudflare-demo.mjs
          node --input-type=module -e '
            const url = new URL(process.env.DEMO_URL);
            if (url.protocol !== "https:" || !url.hostname.startsWith(process.env.DEMO_WORKER_NAME + ".") || !url.hostname.endsWith(".workers.dev")) {
              throw Error("DEMO_URL must be the configured demo Worker workers.dev URL");
            }
          '
      - name: Install and validate packages
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @tomny-dev/cloudflare build
          pnpm build
          pnpm --filter @tomny-dev/cloudflare-example typecheck
          pnpm --filter @tomny-dev/cloudflare-example build
      - name: Apply demo D1 migration
        working-directory: examples/cloudflare-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 d1 migrations apply DB --remote
      - name: Deploy demo Worker
        working-directory: examples/cloudflare-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 deploy
      - name: Smoke-test deployed frontend, Worker and D1
        env:
          DEMO_WORKER_NAME: ${{ vars.DEMO_WORKER_NAME }}
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: node scripts/smoke-cloudflare-demo.mjs
