name: Reusable Cloudflare D1 migrate and deploy

on:
  workflow_call:
    inputs:
      app_directory:
        type: string
        required: true
      pnpm_version:
        description: Match the caller's packageManager and lockfile
        type: string
        required: true
      database_binding:
        type: string
        required: true
      environment_name:
        type: string
        required: true
      wrangler_config:
        description: Config filename within app_directory, with environment-specific bindings
        type: string
        required: false
        default: wrangler.jsonc
      wrangler_version:
        description: Exact reviewed Wrangler version
        type: string
        required: false
        default: 4.163.0
      deploy_ref:
        type: string
        required: false
        default: refs/heads/main
    secrets:
      # Credentials come from the environment chosen by the protected deploy job.
      # Requiring caller-passed secrets would reject environment-only consumers
      # before GitHub starts that job.
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

# Serialize the entire verification/migration/deployment flow per app and environment.
# Never cancel an in-flight database migration.
concurrency:
  group: cloudflare-deploy-${{ github.repository }}-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == inputs.deploy_ref
    uses: tomny-dev/uzi/.github/workflows/cloudflare-quality.yml@98984353928ad8a6b83d25a3f31eb504babd03e8
    with:
      app_directory: ${{ inputs.app_directory }}
      pnpm_version: ${{ inputs.pnpm_version }}
      verify_d1_migrations: true
      database_binding: ${{ inputs.database_binding }}
      wrangler_config: ${{ inputs.wrangler_config }}
      wrangler_version: ${{ inputs.wrangler_version }}

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    # Requires caller-owned protected environment and scoped credentials/variables.
    environment: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm_version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: pnpm
      - name: Install locked dependencies and rebuild
        env:
          APP_DIRECTORY: ${{ inputs.app_directory }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --dir "$APP_DIRECTORY" run build
      - name: Require Cloudflare credentials in protected deployment job
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Missing Cloudflare credentials for selected protected environment"
            exit 1
          fi
      - name: Refuse mismatched environment resources before remote writes
        env:
          APP_DIRECTORY: ${{ inputs.app_directory }}
          DATABASE_BINDING: ${{ inputs.database_binding }}
          WRANGLER_CONFIG: ${{ inputs.wrangler_config }}
          EXPECTED_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          EXPECTED_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          SMOKE_URL: ${{ vars.CLOUDFLARE_SMOKE_URL }}
        run: |
          set -euo pipefail
          # The caller checkout has no Uzi scripts. Fetch exactly the reviewed
          # helper blob, without another checkout or a mutable branch reference.
          guard_blob=760456362ab17a7fb3f7d3889e4b85e5e18512b7
          guard_script=$(mktemp "$RUNNER_TEMP/cloudflare-deploy-guard.XXXXXX.mjs")
          trap 'rm -f "$guard_script"' EXIT
          curl --fail --show-error --silent --retry 3 --connect-timeout 10 --max-time 60 \
            --proto '=https' --header 'Accept: application/vnd.github.raw+json' \
            "https://api.github.com/repos/tomny-dev/uzi/git/blobs/$guard_blob" > "$guard_script"
          test "$(git hash-object --no-filters "$guard_script")" = "$guard_blob"
          cd "$APP_DIRECTORY"
          node "$guard_script"
      - name: Migrate remote D1, then deploy Worker
        env:
          APP_DIRECTORY: ${{ inputs.app_directory }}
          DATABASE_BINDING: ${{ inputs.database_binding }}
          WRANGLER_CONFIG: ${{ inputs.wrangler_config }}
          WRANGLER_VERSION: ${{ inputs.wrangler_version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm dlx "wrangler@$WRANGLER_VERSION" d1 migrations apply "$DATABASE_BINDING" --remote --config "$APP_DIRECTORY/$WRANGLER_CONFIG"
          pnpm dlx "wrangler@$WRANGLER_VERSION" deploy --config "$APP_DIRECTORY/$WRANGLER_CONFIG"
      - name: Check deployed application health
        env:
          SMOKE_URL: ${{ vars.CLOUDFLARE_SMOKE_URL }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 3 --retry-delay 3 --max-time 20 --proto '=https' --max-redirs 0 "$SMOKE_URL" >/dev/null
          echo "Cloudflare deployment health check passed" >> "$GITHUB_STEP_SUMMARY"
