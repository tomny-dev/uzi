name: Reusable Cloudflare D1 migrate and deploy

on:
  workflow_call:
    inputs:
      app_directory:
        type: string
        required: true
      pnpm_version:
        description: Match the caller's packageManager and lockfile
        type: string
        required: true
      database_binding:
        type: string
        required: true
      environment_name:
        type: string
        required: true
      wrangler_config:
        description: Config filename within app_directory, with environment-specific bindings
        type: string
        required: false
        default: wrangler.jsonc
      wrangler_version:
        description: Exact reviewed Wrangler version
        type: string
        required: false
        default: 4.163.0
      deploy_ref:
        type: string
        required: false
        default: refs/heads/main
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

# Serialize the entire verification/migration/deployment flow per app and environment.
# Never cancel an in-flight database migration.
concurrency:
  group: cloudflare-deploy-${{ github.repository }}-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == inputs.deploy_ref
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm_version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check scripts and run application quality gate
        env:
          APP_DIRECTORY: ${{ inputs.app_directory }}
        run: |
          set -euo pipefail
          test -f "$APP_DIRECTORY/package.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { scripts = {} } = JSON.parse(readFileSync(process.env.APP_DIRECTORY + "/package.json", "utf8"));
            for (const name of ["typecheck", "test", "build"]) {
              if (!scripts[name]) throw new Error("Missing required application script: " + name);
            }
          '
          for script in lint format:check; do
            if SCRIPT="$script" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const scripts = JSON.parse(readFileSync(process.env.APP_DIRECTORY + "/package.json", "utf8")).scripts ?? {};
              process.exit(scripts[process.env.SCRIPT] ? 0 : 1);
            '; then
              pnpm --dir "$APP_DIRECTORY" run "$script"
            fi
          done
          pnpm --dir "$APP_DIRECTORY" run typecheck
          pnpm --dir "$APP_DIRECTORY" run test
          pnpm --dir "$APP_DIRECTORY" run build
      - name: Apply migrations to fresh local D1 first
        env:
          APP_DIRECTORY: ${{ inputs.app_directory }}
          DATABASE_BINDING: ${{ inputs.database_binding }}
          WRANGLER_CONFIG: ${{ inputs.wrangler_config }}
          WRANGLER_VERSION: ${{ inputs.wrangler_version }}
        run: |
          set -euo pipefail
          [[ "$DATABASE_BINDING" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || exit 1
          [[ "$WRANGLER_CONFIG" =~ ^[A-Za-z0-9._-]+$.jsonc?$ ]] || exit 1
          [[ "$WRANGLER_VERSION" =~ ^[0-9]+$.[0-9]+$.[0-9]+$ ]] || exit 1
          test -f "$APP_DIRECTORY/$WRANGLER_CONFIG"
          pnpm dlx "wrangler@$WRANGLER_VERSION" d1 migrations apply "$DATABASE_BINDING" --local --config "$APP_DIRECTORY/$WRANGLER_CONFIG" --persist-to "$RUNNER_TEMP/cloudflare-deploy-d1"

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    # Requires caller-owned protected environment and scoped credentials/variables.
    environment: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm_version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: pnpm
      - name: Install locked dependencies and rebuild
        env:
          APP_DIRECTORY: ${{ inputs.app_directory }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --dir "$APP_DIRECTORY" run build
      - name: Refuse mismatched environment resources before remote writes
        env:
          APP_DIRECTORY: ${{ inputs.app_directory }}
          DATABASE_BINDING: ${{ inputs.database_binding }}
          WRANGLER_CONFIG: ${{ inputs.wrangler_config }}
          EXPECTED_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          EXPECTED_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          SMOKE_URL: ${{ vars.CLOUDFLARE_SMOKE_URL }}
        run: |
          set -euo pipefail
          cd "$APP_DIRECTORY"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import ts from "typescript";
          const {
            WRANGLER_CONFIG: filename, DATABASE_BINDING: binding,
            EXPECTED_WORKER_NAME: worker, EXPECTED_DATABASE_ID: databaseId, SMOKE_URL: smokeUrl,
          } = process.env;
          if (!/^[A-Za-z0-9._-]+\.jsonc?$/.test(filename || "")) throw Error("Invalid Wrangler config filename");
          if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(binding || "")) throw Error("Invalid D1 binding");
          if (!/^[a-z0-9][a-z0-9-]*$/.test(worker || "")) throw Error("Missing/invalid CLOUDFLARE_WORKER_NAME environment variable");
          if (!/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i.test(databaseId || "")) throw Error("Missing/invalid CLOUDFLARE_D1_DATABASE_ID environment variable");
          const url = new URL(smokeUrl || "http://invalid.invalid/");
          if (url.protocol !== "https:" || url.username || url.password || !url.hostname) throw Error("CLOUDFLARE_SMOKE_URL must use HTTPS");
          const parsed = ts.parseConfigFileTextToJson(filename, readFileSync(filename, "utf8"));
          if (parsed.error) throw Error(ts.flattenDiagnosticMessageText(parsed.error.messageText, "\n"));
          const config = parsed.config;
          if (config.name !== worker) throw Error("Worker name does not match protected environment");
          const databases = (config.d1_databases ?? []).filter(db => db.binding === binding);
          if (databases.length !== 1 || databases[0].database_id !== databaseId) {
            throw Error("D1 binding/database_id does not match protected environment");
          }
          console.log("Worker and D1 match protected environment; remote migration authorized");
          NODE
      - name: Migrate remote D1, then deploy Worker
        env:
          APP_DIRECTORY: ${{ inputs.app_directory }}
          DATABASE_BINDING: ${{ inputs.database_binding }}
          WRANGLER_CONFIG: ${{ inputs.wrangler_config }}
          WRANGLER_VERSION: ${{ inputs.wrangler_version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm dlx "wrangler@$WRANGLER_VERSION" d1 migrations apply "$DATABASE_BINDING" --remote --config "$APP_DIRECTORY/$WRANGLER_CONFIG"
          pnpm dlx "wrangler@$WRANGLER_VERSION" deploy --config "$APP_DIRECTORY/$WRANGLER_CONFIG"
      - name: Check deployed application health
        env:
          SMOKE_URL: ${{ vars.CLOUDFLARE_SMOKE_URL }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 3 --retry-delay 3 --max-time 20 --proto '=https' --max-redirs 0 "$SMOKE_URL" >/dev/null
          echo "Cloudflare deployment health check passed" >> "$GITHUB_STEP_SUMMARY"
